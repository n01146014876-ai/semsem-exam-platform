<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Semsem Academy | Online Exam Platform</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #102a43;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 45px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      color: #123b67;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 35px;
    }

    .badge {
      display: inline-block;
      background: #e6f7ff;
      color: #087ea4;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #1769e0;
      color: white;
      padding: 15px 32px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #1256bb;
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">SEMSEM ACADEMY</div>

    <div class="subtitle">
      English & Sales Platform
    </div>

    <div class="badge">
      Online Examination System
    </div>

    <h1>Welcome to Semsem Academy</h1>

    <p>
      Professional online examination platform for
      English & Sales students.
    </p>

    <a class="button" href="#">
      START EXAM
    </a>

    <div class="footer">
      Semsem Academy Online Exam Platform
    </div>

  </div>

</body>
</html>
